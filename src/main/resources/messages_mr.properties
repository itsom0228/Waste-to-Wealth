cat.wheat=गव्हाचा भुसा व काड
cat.wheat.desc=मशरूम शेती, कागद उद्योग आणि जनावरांच्या पौष्टिक चाऱ्यासाठी उत्तम गाठी.
cat.rice=भाताचा भुसा व पेंढा
cat.rice.desc=औद्योगिक बॉयलर्स, सिमेंट भट्ट्या आणि सिलिकासाठी उच्च उष्णता मूल्य असलेला बायोमास.
cat.sugarcane=उसाचे पाचट व अवशेष
cat.sugarcane.desc=वीज सह-निर्मिती प्रकल्प, ब्रिकेट्स आणि उत्कृष्ट आच्छादनासाठी उपयुक्त.
cat.cotton=कापसाची पराटी
cat.cotton.desc=पार्टिकल बोर्ड आणि औष्णिक बायो-ऊर्जेसाठी कठीण व उच्च दर्जाचे लाकूड अवशेष.
cat.corn=मक्याचे अवशेष व कणसे
cat.corn.desc=बायो-प्लॅस्टिक्स, सायलेज मुरघास आणि रासायनिक पुनर्प्राप्तीसाठी फायदेशीर.
cat.soybean=सोयाबीनचे कुटार व भुसा
cat.soybean.desc=जमिनीची सुपीकता वाढवणारे कंपोस्ट आणि पौष्टिक पशुखाद्य निर्मितीसाठी.
cat.banana=केळीचे खोड व फायबर अवशेष
cat.banana.desc=नैसर्गिक धागे, पर्यावरणपूरक कागद आणि सेंद्रिय द्रव खतासाठी उत्कृष्ट.
cat.other=इतर कृषी अवशेष
cat.other.desc=सुका पालापाचोळा, नारळाच्या करवंट्या आणि इतर हंगामी फळबाग अवशेष.

workflow.badge=अत्यंत सोपे व पारदर्शक
workflow.title=बाजारपेठ कशी काम करते?
workflow.desc=शेतकरी आणि औद्योगिक खरेदीदार यांच्यासाठी डिझाइन केलेली सोपी व सुरक्षित ४-टप्प्यांची कार्यपद्धती.
step1.title=१. शेतकरी कचरा नोंदवतो
step1.desc=शेतकरी कचऱ्याचा प्रकार, वजनातील प्रमाण (टन), अपेक्षित दर आणि शेताचा पत्ता फोटोसह नोंदवतो.
step2.title=२. खरेदीदार विनंती करतो
step2.desc=सत्यापित उद्योग आपल्या तालुक्यातील कचरा शोधून मागणी व वाहतुकीची तारीख ठरवतात.
step3.title=३. शेतकरी मंजुरी देतो
step3.desc=शेतकरी दर व अटी तपासून मंजुरी देतो. सिस्टीम तात्काळ खरेदी आदेश (Purchase Order) तयार करते.
step4.title=४. शेतातून उचल व थेट मोबदला
step4.desc=खरेदीदार शेतातून वाहतूक करतो, पेमेंट निश्चित होते आणि व्यवहार यशस्वीपणे पूर्ण होतो.

benefits.farmer.title=शेतकऱ्यांसाठी थेट फायदे
benefits.farmer.subtitle=प्रत्येक हंगामाच्या काढणीनंतर शेतातील अवशेषांचे खात्रीशीर नवीन उत्पन्नात रूपांतर करा.
benefits.farmer.item1.title=अतिरिक्त लाखोंचे उत्पन्न:
benefits.farmer.item1.desc=कचरा काढण्याचा किंवा नष्ट करण्याचा खर्च वाचवून हक्काचा रोख मोबदला मिळवा.
benefits.farmer.item2.title=दंड व नुकसानीपासून मुक्ती:
benefits.farmer.item2.desc=पराली जाळण्याची गरज नाही; पर्यावरण नियमांचे पालन व गावाची हवा शुद्ध ठेवा.
benefits.farmer.item3.title=शेताच्या बांधावरून थेट उचल:
benefits.farmer.item3.desc=खरेदीदार स्वतः वाहने आणून शेतातून माल गोळा करतात.
benefits.farmer.item4.title=दलालांशिवाय थेट व्यवहार:
benefits.farmer.item4.desc=शेतकरी आणि कंपनी यांच्यात पारदर्शक व्यवहार, दलालांचे कमिशन शून्य.

benefits.buyer.title=खरेदीदार व उद्योगांसाठी फायदे
benefits.buyer.subtitle=बायोमास पेलेट्स, कागद, इथेनॉल आणि खत कारखान्यांसाठी खात्रीशीर कच्चा माल पुरवठा.
benefits.buyer.item1.title=नियमित कच्चा माल:
benefits.buyer.item1.desc=सत्यापित शेतकरी समूहांकडून थेट मोठ्या प्रमाणावर कृषी अवशेष मिळवा.
benefits.buyer.item2.title=स्थानिक तालुका व जिल्हा शोध:
benefits.buyer.item2.desc=कमी वाहतूक खर्चासाठी जवळच्या गावांमधील शेतकरी शोधा.
benefits.buyer.item3.title=गुणवत्तेची पूर्ण खात्री:
benefits.buyer.item3.desc=कचऱ्याचे मूळ शेत, आर्द्रता प्रमाण आणि काढणीचा अचूक कालावधी आधीच पहा.
benefits.buyer.item4.title=पर्यावरण पूरक ESG गुण:
benefits.buyer.item4.desc=हरित अर्थव्यवस्थेला चालना देऊन कॉर्पोरेट सस्टेनेबिलिटी ध्येये साध्य करा.

impact.badge=पर्यावरण रक्षण मोहीम
impact.title=शेतातील कचरा जाळणे आता कायमचे बंद!
impact.desc=भारतात दरवर्षी ९ कोटी टनांपेक्षा जास्त पिकांचे अवशेष शेतात जाळले जातात, ज्यामुळे प्राणघातक धूर होतो आणि जमिनीची सुपीकता नष्ट होते. वेस्ट टू वेल्थ हा दुवा जोडून त्याच अवशेषांपासून हरित ऊर्जा, बायो-कोल आणि सेंद्रिय खत बनवून पर्यावरण वाचवते.
impact.stat1=वार्षिक संभाव्य बायोमास
impact.stat2=धूरमुक्त स्वच्छ हवा
impact.stat3=जमिनीतील जिवाणूंचे रक्षण

cta.title=तुमचा शेती कचरा सोन्यासारखा विकायला तयार आहात?
cta.desc=आजच महाराष्ट्रातील व भारतातील हजारो जागरूक शेतकरी आणि उद्योजकांसोबत सामील व्हा.

