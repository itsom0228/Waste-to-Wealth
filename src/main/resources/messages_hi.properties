cat.wheat=गेहूं का भूसा व डंठल
cat.wheat.desc=मशरूम की खेती, कागज निर्माण और पौष्टिक पशु चारे के लिए सर्वोत्तम गांठें।
cat.rice=धान की पराली व भूसी
cat.rice.desc=औद्योगिक बॉयलरों, सीमेंट भट्टों और सिलिका निष्कर्षण के लिए उच्च कैलोरी बायोमास।
cat.sugarcane=गन्ने की सूखी पत्तियां (पाचट)
cat.sugarcane.desc=बिजली सह-उत्पादन, बायो-ब्रिकेट्स और मिट्टी मल्चिंग के लिए उपयोगी।
cat.cotton=कपास की डंठल
cat.cotton.desc=पार्टिकल बोर्ड और थर्मल बायो-एनर्जी के लिए मजबूत लिग्नोसेल्युलोसिक डंठल।
cat.corn=मक्के के अवशेष व भुट्टे
cat.corn.desc=बायो-प्लास्टिक, साइलेज मुरघास और रासायनिक निष्कर्षण के लिए उपयोगी।
cat.soybean=सोयाबीन का भूसा व तना
cat.soybean.desc=मिट्टी की उर्वरता बढ़ाने वाले कम्पोस्ट और पशु चारे के लिए उच्च प्रोटीन अवशेष।
cat.banana=केले के तने का रेशा
cat.banana.desc=प्राकृतिक वस्त्र, पर्यावरण-अनुकूल कागज और तरल जैविक उर्वरक के लिए उपयुक्त।
cat.other=अन्य कृषि अपशिष्ट
cat.other.desc=सूखे पत्ते, नारियल के छिलके और मौसमी बागवानी अवशेष।

workflow.badge=सरल और पारदर्शी
workflow.title=मार्केटप्लेस कैसे काम करता है?
workflow.desc=किसानों और औद्योगिक खरीदारों दोनों की सुविधा के लिए तैयार की गई सुरक्षित ४-चरणीय प्रक्रिया।
step1.title=१. किसान अवशेष दर्ज करता है
step1.desc=किसान फसल अवशेष का प्रकार, टन में मात्रा, प्रति यूनिट दर और खेत का पता फोटो सहित जोड़ता है।
step2.title=२. खरीदार मांग भेजता है
step2.desc=सत्यापित उद्योग अपने क्षेत्र में खोज करते हैं और आवश्यक मात्रा तथा उठान की तारीख प्रस्तावित करते हैं।
step3.title=३. किसान स्वीकृति देता है
step3.desc=किसान शर्तों की समीक्षा कर मंजूरी देता है। सिस्टम तुरंत खरीद आदेश (Purchase Order) बनाता है।
step4.title=४. उठान और सीधा भुगतान
step4.desc=खरीदार खेत से माल उठाता है, भुगतान की पुष्टि होती है और सौदा सफलतापूर्वक पूरा होता है।

benefits.farmer.title=किसानों के लिए लाभ
benefits.farmer.subtitle=हर फसल कटाई के बाद खेतों के अवशेषों को एक निश्चित नई आमदनी में बदलें।
benefits.farmer.item1.title=लाखों की अतिरिक्त आय:
benefits.farmer.item1.desc=खेत खाली करने के खर्च से बचें और कचरे का वाजिब मूल्य पाएं।
benefits.farmer.item2.title=जुर्माने और धुएं से मुक्ति:
benefits.farmer.item2.desc=पराली जलाने की जरूरत नहीं; पर्यावरण नियमों का पालन करें और गांव की हवा शुद्ध रखें।
benefits.farmer.item3.title=खेत से सीधी ढुलाई:
benefits.farmer.item3.desc=खरीदार खुद आपके गांव आकर खेत से अवशेष उठाते हैं।
benefits.farmer.item4.title=बिचौलियों के बिना सीधा सौदा:
benefits.farmer.item4.desc=पारदर्शी मूल्य समझौता, कोई कमीशनखोरी नहीं।

benefits.buyer.title=उद्योगों और खरीदारों के लिए लाभ
benefits.buyer.subtitle=बायोमास पेलेट्स, कागज, इथेनॉल और खाद संयंत्रों के लिए कच्चा माल आपूर्ति नेटवर्क।
benefits.buyer.item1.title=नियमित कच्चा माल:
benefits.buyer.item1.desc=सत्यापित किसान समूहों से सीधे थोक कृषि अवशेष प्राप्त करें।
benefits.buyer.item2.title=तहसील और जिला स्तर पर खोज:
benefits.buyer.item2.desc=परिवहन लागत कम करने के लिए नजदीकी गांवों के किसानों को खोजें।
benefits.buyer.item3.title=गुणवत्ता की पूर्ण जांच:
benefits.buyer.item3.desc=खेत का पता, कटाई का समय, नमी का स्तर और विक्रेता का विवरण पहले से देखें।
benefits.buyer.item4.title=हरित ईएसजी (ESG) क्रेडिट:
benefits.buyer.item4.desc=सर्कुलर इकोनॉमी खरीद के जरिए कॉर्पोरेट स्थिरता लक्ष्य पूरे करें।

impact.badge=पर्यावरण संरक्षण मिशन
impact.title=पराली और कृषि कचरा जलाना अब हमेशा के लिए बंद!
impact.desc=भारत में हर साल ९ करोड़ टन से अधिक फसल अवशेष जलाए जाते हैं, जिससे जानलेवा स्मॉग बनता है और मिट्टी के पोषक तत्व नष्ट हो जाते हैं। वेस्ट टू वेल्थ इस चक्र को बदलकर उसी अवशेष से हरित ऊर्जा, बायो-कोयला और जैविक खाद बनाता है।
impact.stat1=वार्षिक बायोमास क्षमता
impact.stat2=धुआं-मुक्त स्वच्छ भारत
impact.stat3=मिट्टी के सूक्ष्मजीवों की सुरक्षा

cta.title=क्या आप अपने खेत के कचरे को दौलत में बदलने के लिए तैयार हैं?
cta.desc=आज ही भारत भर के हजारों प्रगतिशील किसानों और टिकाऊ औद्योगिक खरीदारों से जुड़ें।

