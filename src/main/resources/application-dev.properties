# ==============================================================================
# WASTE TO WEALTH - DEVELOPMENT PROFILE CONFIGURATION
# ==============================================================================

# HikariCP Cloud Connection Pool Resilience
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# JPA & Hibernate Settings (Auto-detects MySQLDialect or H2Dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Flyway Migrations (Managed safely via FlywayMigrationStrategy in DatabaseConfig)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logging Configuration
logging.level.root=INFO
logging.level.com.wastetowealth=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
