# ==============================================================================
# WASTE TO WEALTH - DEVELOPMENT PROFILE CONFIGURATION (MYSQL)
# ==============================================================================

# Database Connection (Defaults to Aiven Cloud MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-19ea9bc6-onkarsarpane-2682.j.aivencloud.com}:${DB_PORT:22864}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Pool Resilience
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logging Configuration
logging.level.root=INFO
logging.level.com.wastetowealth=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

