workflow.badge=Simple & Transparent
workflow.title=How the Marketplace Works
workflow.desc=A streamlined, secure 4-step workflow designed for ease of use by farmers and commercial enterprises alike.
step1.title=Farmer Lists Waste
step1.desc=Farmer registers and lists waste type, quantity in tons, expected unit rate, and farm location with photos.
step2.title=Buyer Submits Request
step2.desc=Verified industrial buyers search regionally, specify required quantity and proposed pickup schedule.
step3.title=Farmer Accepts & Reserves
step3.desc=Farmer reviews terms and confirms request. System automatically reserves stock and creates a Purchase Order.
step4.title=Pickup & Settlement
step4.desc=Agreed logistics pick up biomass from farm gate, payment is confirmed, and both parties track order completion.

benefits.farmer.title=Benefits For Farmers
benefits.farmer.subtitle=Convert crop residues into a dependable new revenue stream after every harvesting season.
benefits.farmer.item1.title=Earn Extra Income:
benefits.farmer.item1.desc=Receive fair market rates instead of bearing costs for clearing or disposing of residue.
benefits.farmer.item2.title=No Stubble Burning Penalties:
benefits.farmer.item2.desc=Comply smoothly with environmental standards and safeguard rural community health.
benefits.farmer.item3.title=Direct Farm-Gate Pickup:
benefits.farmer.item3.desc=Buyers arrange transport from your designated village location.
benefits.farmer.item4.title=Direct Communication:
benefits.farmer.item4.desc=Transparent price agreements without exploitative middle agents.

benefits.buyer.title=Benefits For Buyers & Industries
benefits.buyer.subtitle=Direct procurement pipeline for biomass pellets, paper, ethanol, composting, and packaging.
benefits.buyer.item1.title=Consistent Raw Material Supply:
benefits.buyer.item1.desc=Source bulk agricultural residues directly from verified farming clusters.
benefits.buyer.item2.title=Hyper-Local Regional Search:
benefits.buyer.item2.desc=Filter by taluka, district, and radius to optimize haulage and transport costs.
benefits.buyer.item3.title=Transparent Traceability:
benefits.buyer.item3.desc=Know the farm origin, harvest time, moisture grade, and seller reliability.
benefits.buyer.item4.title=Green Supply Chain Credits:
benefits.buyer.item4.desc=Enhance corporate ESG sustainability scores through circular economy procurement.

impact.badge=Environmental Mission
impact.title=Ending the Scourge of Stubble Burning
impact.desc=In India, over 90 million tons of crop stubble are burned each post-harvest season, generating hazardous smog and depleting critical soil nutrients. Waste to Wealth closes this loop by turning that biomass into raw material for bio-coal, clean electricity, eco-cutlery, and organic fertilizer.
