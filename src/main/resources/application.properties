# ==============================================================================
# WASTE TO WEALTH - APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=waste-to-wealth
server.port=${PORT:10000}
server.servlet.context-path=

# Active Profile (defaults to 'dev')
spring.profiles.active=dev

# Database Connection (Defaults to verified Aiven Cloud MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-19ea9bc6-onkarsarpane-2682.j.aivencloud.com}:${DB_PORT:22864}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# File Upload Constraints
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Accelerate Tomcat boot from 65s to 3s by skipping non-JSP jar TLD scanning
server.tomcat.additional-tld-skip-patterns=*.jar
