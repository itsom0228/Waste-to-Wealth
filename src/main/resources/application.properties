# ==============================================================================
# WASTE TO WEALTH - APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=waste-to-wealth
server.port=${PORT:8082}
server.servlet.context-path=

# Active Profile (defaults to 'dev')
spring.profiles.active=dev

# Database Connection (MySQL 8.x)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:waste_to_wealth}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Python@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# File Upload Constraints
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
