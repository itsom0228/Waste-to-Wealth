services:
  - type: web
    name: waste-to-wealth
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_HOST
        value: mysql-19ea9bc6-onkarsarpane-2682.j.aivencloud.com
      - key: DB_PORT
        value: 22864
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
