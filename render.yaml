services:
  - type: web
    name: waste-to-wealth
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: waste_to_wealth
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: Python@123
